[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "local-soc-analyst"
version = "0.1.0"
description = "Triage Linux auth.log and Windows/Sysmon events with ATT&CK-mapped rules and a local LLM. Nothing leaves your machine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Cyhelm-Vciso" }]
keywords = ["soc", "dfir", "log-analysis", "mitre-attack", "sysmon", "ollama", "local-llm", "blue-team"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Security", "Environment :: Console"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Cyhelm-Vciso/local-soc-analyst"
Issues = "https://github.com/Cyhelm-Vciso/local-soc-analyst/issues"

[project.scripts]
soc-analyst = "soc_analyst.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/soc_analyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
